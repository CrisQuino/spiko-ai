name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # ─────────────────────────────────────────
  # 1. LINT + TYPECHECK + UNIT TESTS
  # ─────────────────────────────────────────
  test:
    name: Lint / TypeCheck / Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        # `npm install` (not `npm ci`) tolerates the platform-specific optional
        # wasm resolver binding (@unrs/resolver-binding-wasm32-wasi → @emnapi)
        # whose nested versions can't be regenerated deterministically on
        # Windows; it repairs the lock in place the same way Vercel's build does.
        run: npm install --no-audit --no-fund

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript type check
        run: npm run typecheck

      - name: Run unit tests
        run: npm run test -- --run --coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/

  # ─────────────────────────────────────────
  # 2. BUILD VERIFICATION
  # ─────────────────────────────────────────
  build:
    name: Build Verification
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        # `npm install` (not `npm ci`) tolerates the platform-specific optional
        # wasm resolver binding (@unrs/resolver-binding-wasm32-wasi → @emnapi)
        # whose nested versions can't be regenerated deterministically on
        # Windows; it repairs the lock in place the same way Vercel's build does.
        run: npm install --no-audit --no-fund

      - name: Build Next.js app
        run: npm run build
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

  # ─────────────────────────────────────────
  # 3. E2E TESTS (Playwright)
  # ─────────────────────────────────────────
  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        # `npm install` (not `npm ci`) tolerates the platform-specific optional
        # wasm resolver binding (@unrs/resolver-binding-wasm32-wasi → @emnapi)
        # whose nested versions can't be regenerated deterministically on
        # Windows; it repairs the lock in place the same way Vercel's build does.
        run: npm install --no-audit --no-fund

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: npx playwright test --project=chromium
        env:
          CI: true

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/

  # ─────────────────────────────────────────
  # 4. SUPABASE MIGRATIONS CHECK
  # ─────────────────────────────────────────
  migrations:
    name: Supabase Migrations Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Verify migrations are present
        run: |
          if [ ! -d "migrations" ]; then
            echo "❌ No migrations directory found!"
            exit 1
          fi
          echo "✅ Migrations directory found"
          ls -la migrations/

      - name: Check migration files format
        run: |
          for f in migrations/*.sql; do
            if [ -f "$f" ]; then
              echo "Checking $f..."
              # Basic SQL syntax check (looking for common issues)
              if grep -q "<<<<<<< HEAD" "$f"; then
                echo "❌ Merge conflict found in $f"
                exit 1
              fi
            fi
          done
          echo "✅ All migration files look valid"
